<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Environment Variables — Opun8</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.5;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 32px;
            max-width: 640px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }

        .card h1 {
            font-size: 22px;
            font-weight: 700;
            color: #111;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .var-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .var-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            flex-shrink: 0;
            accent-color: #0066ff;
        }

        .var-row .name-input {
            flex: 0 0 150px;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            color: #333;
            background: #f9f9f9;
            outline: none;
        }

        .var-row .value-wrapper {
            flex: 1;
            min-width: 0;
            position: relative;
            display: flex;
            align-items: center;
        }

        .var-row .value-wrapper input {
            width: 100%;
            padding: 8px 36px 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            color: #333;
            outline: none;
            transition: border-color 0.15s;
        }

        .var-row .value-wrapper input:focus {
            border-color: #0066ff;
        }

        .var-row .toggle-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: color 0.15s, background 0.15s;
        }

        .var-row .toggle-btn:hover {
            color: #0066ff;
            background: #f0f6ff;
        }

        .var-row .toggle-btn svg {
            width: 16px;
            height: 16px;
            display: block;
        }

        .var-row .delete-btn {
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            padding: 4px;
            font-size: 18px;
            line-height: 1;
            border-radius: 4px;
            flex-shrink: 0;
            transition: color 0.15s, background 0.15s;
        }

        .var-row .delete-btn:hover {
            color: #ff4444;
            background: #fff0f0;
        }

        .add-row {
            display: none;
            gap: 10px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px dashed #ddd;
            flex-wrap: wrap;
        }

        .add-row.visible {
            display: flex;
        }

        .add-row input {
            flex: 1 1 160px;
            min-width: 0;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            color: #333;
            outline: none;
        }

        .add-row input:focus {
            border-color: #0066ff;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.15s;
            font-family: inherit;
        }

        .btn-primary {
            background: #0066ff;
            color: #fff;
        }

        .btn-primary:hover {
            background: #0052cc;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-success {
            background: #00a86b;
            color: #fff;
        }

        .btn-success:hover {
            background: #008f5a;
        }

        .btn-danger {
            background: #ff4444;
            color: #fff;
        }

        .btn-danger:hover {
            background: #cc3333;
        }

        .stats {
            color: #888;
            font-size: 13px;
            margin-top: 16px;
        }

        .message {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
        }

        .message.visible {
            display: block;
        }

        .message-error {
            background: #fff0f0;
            color: #cc3333;
            border: 1px solid #ffd0d0;
        }

        .message-success {
            background: #f0fff4;
            color: #008f5a;
            border: 1px solid #c0f0d0;
        }

        .message-info {
            background: #f0f6ff;
            color: #0052cc;
            border: 1px solid #d0e0ff;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #888;
            font-size: 14px;
        }

        .done-state {
            text-align: center;
            padding: 40px 20px;
        }

        .done-state .done-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-top: 10px;
        }

        .done-state .done-sub {
            color: #888;
            font-size: 13px;
            margin-top: 6px;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 520px) {
            .card {
                padding: 20px;
            }

            .var-row {
                flex-wrap: wrap;
            }

            .var-row .name-input {
                flex: 1 1 100%;
            }

            .var-row .value-wrapper {
                flex: 1 1 100%;
            }

            .actions .btn {
                flex: 1 1 100%;
            }
        }
    </style>
</head>
<body>
    <div class="card" id="app">
        <h1>Environment Variables</h1>
        <p class="subtitle">Configure variables for your deployment.</p>

        <div id="vars-container">
            <div class="empty-state">Loading variables...</div>
        </div>

        <div class="add-row" id="add-row">
            <input type="text" id="new-var-name" placeholder="VARIABLE_NAME" autocomplete="off" spellcheck="false" />
            <input type="text" id="new-var-value" placeholder="value" autocomplete="off" />
            <button class="btn btn-success" onclick="addVariable()" type="button">Add</button>
            <button class="btn btn-secondary" onclick="cancelAdd()" type="button">Cancel</button>
        </div>

        <div class="actions" id="actions">
            <button class="btn btn-secondary" onclick="showAddRow()" id="add-btn" type="button">+ Add Variable</button>
            <button class="btn btn-primary" onclick="saveAndDeploy()" type="button">Save &amp; Deploy</button>
            <button class="btn btn-danger" onclick="cancel()" type="button">Cancel</button>
        </div>

        <div class="stats" id="stats"></div>
        <div class="message" id="message"></div>
    </div>

    <script>
        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        const ICON_EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
        const ICON_EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

        let vars = [];
        const visibleState = {};

        function loadVars() {
            fetch('/api/vars')
                .then((r) => r.json())
                .then((data) => {
                    vars = data;
                    renderVars();
                })
                .catch(() => {
                    document.getElementById('vars-container').innerHTML =
                        '<div class="empty-state">Could not load variables.</div>';
                });
        }

        function renderVars() {
            const container = document.getElementById('vars-container');
            const selected = vars.filter((v) => v.selected).length;
            document.getElementById('stats').textContent =
                'Selected ' + selected + ' of ' + vars.length + ' variables';

            if (vars.length === 0) {
                container.innerHTML =
                    '<div class="empty-state">No variables detected. Add one below.</div>';
                return;
            }

            let html = '';
            vars.forEach((v, i) => {
                const isVisible = visibleState[v.name] === true;
                const inputType = isVisible ? 'text' : 'password';
                const toggleIcon = isVisible ? ICON_EYE_OFF : ICON_EYE;
                html += `
                    <div class="var-row">
                        <input type="checkbox" ${v.selected ? 'checked' : ''} onchange="toggleSelection(${i})" />
                        <input type="text" class="name-input" value="${escapeHtml(v.name)}" readonly />
                        <div class="value-wrapper">
                            <input type="${inputType}" value="${escapeHtml(v.value || '')}" onchange="updateValue(${i}, this.value)" placeholder="value" spellcheck="false" />
                            <button class="toggle-btn" onclick="toggleVisibility('${escapeHtml(v.name)}')" title="${isVisible ? 'Hide' : 'Show'}" type="button">${toggleIcon}</button>
                        </div>
                        <button class="delete-btn" onclick="deleteVariable(${i})" title="Delete" type="button">×</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function toggleVisibility(name) {
            visibleState[name] = !visibleState[name];
            renderVars();
        }

        function toggleSelection(index) {
            const v = vars[index];
            if (!v) return;
            v.selected = !v.selected;
            fetch('/api/toggle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: v.name }),
            }).then(() => renderVars());
        }

        function updateValue(index, value) {
            const v = vars[index];
            if (!v) return;
            v.value = value;
            fetch('/api/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: v.name, value: value }),
            });
        }

        function deleteVariable(index) {
            const v = vars[index];
            if (!v) return;
            if (confirm('Delete "' + v.name + '"?')) {
                fetch('/api/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: v.name }),
                }).then(() => loadVars());
            }
        }

        function showAddRow() {
            document.getElementById('add-row').classList.add('visible');
            document.getElementById('new-var-name').focus();
            hideMessage();
        }

        function cancelAdd() {
            document.getElementById('add-row').classList.remove('visible');
            document.getElementById('new-var-name').value = '';
            document.getElementById('new-var-value').value = '';
            hideMessage();
        }

        function addVariable() {
            const nameInput = document.getElementById('new-var-name');
            const valueInput = document.getElementById('new-var-value');
            const name = nameInput.value.trim();
            const value = valueInput.value;

            if (!name) {
                showMessage('Please enter a variable name.', 'error');
                nameInput.focus();
                return;
            }

            if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) {
                showMessage('Use letters, numbers, and underscores only. Cannot start with a number.', 'error');
                nameInput.focus();
                return;
            }

            fetch('/api/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, value: value }),
            })
                .then((r) => r.json())
                .then((data) => {
                    if (data.success) {
                        cancelAdd();
                        loadVars();
                        showMessage('Added: ' + name, 'success');
                    } else {
                        showMessage(data.error || data.message || 'Could not add variable.', 'error');
                    }
                })
                .catch(() => showMessage('Network error. Please try again.', 'error'));
        }

        function saveAndDeploy() {
            showMessage('Saving...', 'info');
            fetch('/api/save', { method: 'POST' })
                .then((r) => r.json())
                .then((data) => {
                    if (data.success) {
                        showDoneState('Variables saved. Deployment will continue in your terminal.');
                    } else {
                        showMessage(data.error || 'Save failed.', 'error');
                    }
                })
                .catch(() => showMessage('Network error. Please try again.', 'error'));
        }

        function cancel() {
            if (confirm('Cancel deployment?')) {
                fetch('/api/cancel', { method: 'POST' }).then(() => {
                    showDoneState('Cancelled.');
                });
            }
        }

        function showDoneState(message) {
            document.getElementById('actions').classList.add('hidden');
            document.getElementById('add-row').classList.remove('visible');
            document.getElementById('vars-container').innerHTML =
                '<div class="done-state">' +
                '<div class="done-title">' + escapeHtml(message) + '</div>' +
                '<div class="done-sub">You can close this tab now.</div>' +
                '</div>';
            document.getElementById('stats').textContent = '';
            hideMessage();
            try { window.close(); } catch (_) { /* ignore */ }
        }

        function showMessage(msg, type) {
            const el = document.getElementById('message');
            el.className = 'message visible message-' + type;
            el.textContent = msg;
        }

        function hideMessage() {
            const el = document.getElementById('message');
            el.className = 'message';
            el.textContent = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                saveAndDeploy();
                return;
            }
            if (e.key === 'Escape') {
                e.preventDefault();
                const addRow = document.getElementById('add-row');
                if (addRow.classList.contains('visible')) {
                    cancelAdd();
                } else {
                    cancel();
                }
                return;
            }
            if (e.key === 'Enter') {
                const nameInput = document.getElementById('new-var-name');
                const valueInput = document.getElementById('new-var-value');
                if (document.activeElement === nameInput || document.activeElement === valueInput) {
                    e.preventDefault();
                    addVariable();
                }
            }
        });

        loadVars();
    </script>
</body>
</html>
